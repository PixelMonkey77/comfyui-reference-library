# Server tests and the queue-binding check (tests/README.md). Runs on every push and pull request,
# and before publishing (publish.yml calls this workflow).
name: Tests
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows covers the Windows path checks; Linux also installs torch for the loader checks.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: python -m pip install -r tests/requirements.txt
      - name: Install torch (CPU)
        if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m pytest tests
      - name: Queue binding on the example workflow
        run: node tests/bind_example.mjs
