[project]
name = "comfyui-reference-library"
description = "A reference library for ComfyUI: keep reference images, videos and audio in named libraries (files stay in place), type @name in a Reference Prompt and they are wired into model nodes (Nano Banana, Seedance, ...) when you queue."
version = "0.1.9"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
# Uses only what ComfyUI already ships: torch, numpy, Pillow, PyAV, aiohttp.
# The frontend entry is the oldest ComfyUI frontend the pack is known to work with (Nodes 2.0 and the
# internals in web/compat.js); keep it in step with MIN_FRONTEND there.
dependencies = ["comfyui-frontend-package>=1.55.18"]

[project.urls]
Repository = "https://github.com/PixelMonkey77/comfyui-reference-library"

[tool.comfy]
PublisherId = "pixelmonkey77"
DisplayName = "Reference Library"
# The oldest ComfyUI the pack is known to work with.
requires-comfyui = ">=0.45.0"
Icon = "https://raw.githubusercontent.com/PixelMonkey77/comfyui-reference-library/main/docs/images/registry_icon.png"
Banner = "https://raw.githubusercontent.com/PixelMonkey77/comfyui-reference-library/main/docs/images/registry_banner.png"
includes = []
