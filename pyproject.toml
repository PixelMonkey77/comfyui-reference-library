[project]
name = "comfyui-reference-library"
description = "A reference library for ComfyUI: keep reference images, videos and audio in named libraries (files stay in place), type @name in a Reference Prompt and they are wired into model nodes (Nano Banana, Seedance, ...) when you queue."
version = "0.1.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
# Uses only what ComfyUI already ships: torch, numpy, Pillow, PyAV, aiohttp.
dependencies = []

[project.urls]
Repository = "https://github.com/PixelMonkey77/comfyui-reference-library"

[tool.comfy]
PublisherId = ""   # TODO: your publisher id from registry.comfy.org (needed to publish)
DisplayName = "Reference Library"
Icon = ""
includes = []
